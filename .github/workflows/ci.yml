name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sis
          POSTGRES_USER: sis
          POSTGRES_PASSWORD: sis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sis" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sis:sis@localhost:5432/sis
      SECRET_KEY: ci-only-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fail if models changed without a migration
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test
